<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Student Tasks - Login / Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Student Tasks</a>
  </div>
</nav>

<div class="container mt-5">
  <div class="row">
    <div class="col-md-6 offset-md-3">

      <h2 class="text-center mb-4">Bienvenido</h2>

      <!-- Tabs -->
      <ul class="nav nav-tabs mb-3" id="authTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Registro</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Login</button>
        </li>
      </ul>

      <!-- Contenido de Tabs -->
      <div class="tab-content" id="authTabsContent">

        <!-- Registro -->
        <div class="tab-pane fade show active" id="register" role="tabpanel">
          <div class="card p-4 shadow-sm">
            <h4 class="mb-3">Registro</h4>
            <form id="registerForm" class="needs-validation" novalidate>
              <input type="text" id="regName" class="form-control mb-2" placeholder="Nombre" required>
              <div class="invalid-feedback">Por favor, ingresa tu nombre.</div>

              <input type="email" id="regEmail" class="form-control mb-2" placeholder="Correo" required>
              <div class="invalid-feedback">Por favor, ingresa un correo válido.</div>

              <input type="password" id="regPassword" class="form-control mb-3" placeholder="Contraseña" required>
              <div class="invalid-feedback">La contraseña no puede estar vacía.</div>

              <button type="submit" class="btn btn-primary w-100" id="btnRegister">Registrarse</button>
            </form>
          </div>
        </div>

        <!-- Login -->
        <div class="tab-pane fade" id="login" role="tabpanel">
          <div class="card p-4 shadow-sm">
            <h4 class="mb-3">Login</h4>
            <form id="loginForm" class="needs-validation" novalidate>
              <input type="email" id="loginEmail" class="form-control mb-2" placeholder="Correo" required>
              <div class="invalid-feedback">Por favor, ingresa tu correo.</div>

              <input type="password" id="loginPassword" class="form-control mb-3" placeholder="Contraseña" required>
              <div class="invalid-feedback">Por favor, ingresa tu contraseña.</div>

              <button type="submit" class="btn btn-success w-100" id="btnLogin">Ingresar</button>
            </form>
          </div>
        </div>

      </div>

      <div id="msg" class="mt-3 text-center fw-bold"></div>

    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Activar validaciones Bootstrap
  (() => {
    'use strict'
    const forms = document.querySelectorAll('.needs-validation')
    Array.from(forms).forEach(form => {
      form.addEventListener('submit', event => {
        if (!form.checkValidity()) {
          event.preventDefault()
          event.stopPropagation()
        }
        form.classList.add('was-validated')
      }, false)
    })
  })()
</script>
<script src="main.js" defer></script>
</body>
</html>
