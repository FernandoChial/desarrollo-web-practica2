<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Student Tasks - Mis Tareas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Student Tasks</a>
    <button class="btn btn-danger ms-auto" id="btnLogout">Cerrar Sesión</button>
  </div>
</nav>

<div class="container mt-5">
  <h2 class="text-center mb-4">Mis Tareas</h2>

  <div class="mb-3">
    <input type="text" id="taskTitle" class="form-control mb-2" placeholder="Título de la tarea" required>
    <textarea id="taskDesc" class="form-control mb-2" placeholder="Descripción" required></textarea>
    <button class="btn btn-primary w-100" id="btnAddTask">Agregar Tarea</button>
  </div>

  <ul class="list-group" id="tasksList"></ul>
</div>

<script src="tasks.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
